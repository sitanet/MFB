{% extends 'base.html' %}

{% block content %}
<div class="midde_cont">
    <div class="container-fluid">
        <div class="row column_title">
            <div class="col-md-12">
                <div class="page_title">
                    <h2>Send Notification</h2>
                </div>
            </div>
        </div>
        
        <div class="row column1">
            <div class="col-md-8 offset-md-2">
                <div class="white_shd full margin_bottom_30">
                    <div class="full graph_head">
                        <div class="heading1 margin_0">
                            <h2>Create New Notification</h2>
                        </div>
                    </div>
                    
                    <div class="full p-4">
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" name="title" required
                                       placeholder="Enter notification title">
                            </div>
                            
                            <div class="mb-3">
                                <label for="message" class="form-label">Message <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="message" name="message" rows="5" required
                                          placeholder="Enter notification message"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="notification_type" class="form-label">Type</label>
                                <select class="form-select" id="notification_type" name="notification_type">
                                    {% for value, label in notification_types %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Target Recipients</label>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="target_type" id="target_all" value="all" checked onchange="toggleMerchantSelect()">
                                    <label class="form-check-label" for="target_all">
                                        <strong>All Merchants</strong> (Broadcast to everyone)
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="target_type" id="target_selected" value="selected" onchange="toggleMerchantSelect()">
                                    <label class="form-check-label" for="target_selected">
                                        <strong>Selected Merchants</strong> (Choose specific merchants)
                                    </label>
                                </div>
                            </div>
                            
                            <div class="mb-3" id="merchant_select_container" style="display: none;">
                                <label for="merchant_ids" class="form-label">Select Merchants</label>
                                <select class="form-select" id="merchant_ids" name="merchant_ids" multiple size="8">
                                    {% for merchant in merchants %}
                                    <option value="{{ merchant.id }}">{{ merchant.merchant_name }} ({{ merchant.merchant_id }})</option>
                                    {% endfor %}
                                </select>
                                <small class="text-muted">Hold Ctrl/Cmd to select multiple merchants</small>
                                <div class="mt-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="selectAllMerchants()">Select All</button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="deselectAllMerchants()">Deselect All</button>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'merchant:notification_list' %}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i> Send Notification
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function toggleMerchantSelect() {
    const targetSelected = document.getElementById('target_selected').checked;
    const container = document.getElementById('merchant_select_container');
    container.style.display = targetSelected ? 'block' : 'none';
}

function selectAllMerchants() {
    const select = document.getElementById('merchant_ids');
    for (let option of select.options) {
        option.selected = true;
    }
}

function deselectAllMerchants() {
    const select = document.getElementById('merchant_ids');
    for (let option of select.options) {
        option.selected = false;
    }
}
</script>
{% endblock %}
